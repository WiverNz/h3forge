name: Portable Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24.13.0'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned Rust
        run: |
          rustup toolchain install 1.99.1 --profile minimal --target x86_64-pc-windows-msvc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate tag and metadata
        run: |
          . ./scripts/versions.ps1
          if ($env:GITHUB_REF_NAME -cnotmatch '^v(.+)$') { throw 'Expected a version tag.' }
          Test-ReleaseMetadata $Matches[1]
      - name: Install locked frontend dependencies
        run: npm.cmd --prefix web ci --cache .local/npm-cache
      - name: Build portable EXE and checksum
        run: ./scripts/build-portable.ps1
      - name: Inspect embedded frontend, icon and artifact boundaries
        run: node scripts/verify-portable.cjs
      - name: Publish portable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" .local/release/H3Forge.exe .local/release/H3Forge.exe.sha256 --repo "$env:GITHUB_REPOSITORY" --verify-tag --title "H3Forge $env:GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
